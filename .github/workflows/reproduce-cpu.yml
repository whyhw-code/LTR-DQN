name: Reproduce Core (CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      LTR_DQN_BASELINE_TREE_METHOD: hist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9.13
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "from model import validate_runtime; validate_runtime()"
      - name: Record CPU environment
        run: |
          python - <<'PY'
          import json, platform
          import numpy, pandas, torch, xgboost
          from pathlib import Path

          report = {
              "platform": platform.platform(),
              "python": platform.python_version(),
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "torch": torch.__version__,
              "xgboost": xgboost.__version__,
              "cuda_available": torch.cuda.is_available(),
              "baseline_tree_method": "hist",
              "ranker_tree_method": "hist",
          }
          Path("results").mkdir(exist_ok=True)
          Path("results/cpu_environment.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          if report["cuda_available"]:
              raise RuntimeError("CPU verification unexpectedly detected CUDA")
          PY
      - name: Train rankers and DQN models on CPU
        run: python train.py --ranker_tree_method hist
      - name: Export CPU tables
        run: python main.py --export_csvs
      - name: Generate main-text figures on CPU
        run: python Fig_main.py --ranker_tree_method hist --force
      - name: Generate appendix figures except T6 Figure C4
        run: python Appendix_Fig_main.py --figures C1,C2,C3,C5 --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltr-dqn-cpu-${{ github.run_id }}
          path: |
            results/
            runs/
            temp/train_manifest.json
          if-no-files-found: warn
          retention-days: 7
