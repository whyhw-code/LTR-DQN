name: Reproduce Core (CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9.13
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "from model import validate_runtime; validate_runtime()"
      - name: Train rankers and DQN models on CPU
        run: python train.py --ranker_tree_method hist
      - name: Export tables
        run: python main.py --export_csvs
      - name: Generate main-text figures
        run: python Fig_main.py --ranker_tree_method hist --force
      - name: Generate appendix figures except C4
        run: python Appendix_Fig_main.py --figures C1,C2,C3,C5 --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltr-dqn-core-${{ github.run_id }}
          path: |
            results/
            runs/
            temp/train_manifest.json
          if-no-files-found: warn
          retention-days: 14
