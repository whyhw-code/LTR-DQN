name: 1 - One-click Results and Figures (Windows CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.9.13
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify fresh source-only checkout
        shell: pwsh
        run: |
          $generated = @("results", "temp", "model", "runs") |
            Where-Object { Test-Path -LiteralPath $_ }
          if ($generated) {
            throw "Generated directories are present in the source checkout: $($generated -join ', ')"
          }
      - name: Install locked environment
        shell: pwsh
        run: |
          # Keep installer behavior identical across fresh Windows runners.
          python -m pip install --upgrade "pip==24.1.2"
          python -m pip install -r requirements-lock.txt
          python -m pip check
          python -c "from experiment_core import validate_runtime; validate_runtime()"
      - name: Train all models from tracked source data
        run: python train.py --models all --years 2,3,4 --ranker_tree_method approx
      - name: Export T3, T4, T5 and T7 tables
        run: python main.py --export_csvs
      - name: Generate all main-text figures
        run: python Fig_main.py --ranker_tree_method approx --force
      - name: Generate Appendix Figures C1, C2, C3 and C5
        run: python Appendix_Fig_main.py --figures C1,C2,C3,C5 --force
      - name: Upload final tables, figures and manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ltr-dqn-results-and-figures-${{ github.run_id }}
          path: |
            results/combined/
            results/figures/
            results/appendix_figures/
            temp/train_manifest.json
          if-no-files-found: error
          retention-days: 14
