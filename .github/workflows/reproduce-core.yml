name: 1 - Results and Figures (CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: 3.9.13
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify fresh source-only checkout
        shell: bash
        run: |
          test ! -e results
          test ! -e temp
          test ! -e model
          test ! -e runs
      - name: Install locked environment
        shell: bash
        run: |
          # pip >=24.2 misreads the legacy XGBoost 1.7.6 Linux wheel tag in
          # `pip check`, even though pip has just installed the correct wheel.
          python -m pip install --upgrade "pip==24.1.2"
          python -m pip install -r requirements-lock.txt
          python -m pip check
          python -c "from experiment_core import validate_runtime; validate_runtime()"
      - name: Train all models from tracked source data
        run: python train.py --models all --years 2,3,4 --ranker_tree_method approx
      - name: Export T3, T4, T5 and T7 tables
        run: python main.py --export_csvs
      - name: Generate all main-text figures
        run: python Fig_main.py --ranker_tree_method approx --force
      - name: Generate Appendix Figures C1, C2, C3 and C5
        run: python Appendix_Fig_main.py --figures C1,C2,C3,C5 --force
      - name: Upload final tables, figures and manifests
        uses: actions/upload-artifact@v4
        with:
          name: ltr-dqn-results-and-figures-${{ github.run_id }}
          path: |
            results/combined/
            results/figures/
            results/appendix_figures/
            temp/train_manifest.json
          if-no-files-found: error
          retention-days: 14
