name: 2 - T6 and Figure C4 (CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 720
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: 3.9.13
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify fresh source-only checkout
        shell: pwsh
        run: |
          $generated = @("results", "temp", "model", "runs") |
            Where-Object { Test-Path -LiteralPath $_ }
          if ($generated) {
            throw "Generated directories are present in the source checkout: $($generated -join ', ')"
          }
      - name: Install locked environment
        shell: pwsh
        run: |
          # Keep installer behavior identical across fresh Windows runners.
          python -m pip install --upgrade "pip==24.1.2"
          python -m pip install -r requirements-lock.txt
          python -m pip check
          python -c "from experiment_core import validate_runtime; validate_runtime()"
      - name: Train three-year models and sample T6 from tracked source data
        run: python train.py --models all --years 3 --t6 --ranker_tree_method approx
      - name: Export T6 workbook and Figure C4
        run: |
          python T6_main.py
          python Appendix_Fig_main.py --figures C4 --force
      - name: Upload final T6 table, figure and manifests
        uses: actions/upload-artifact@v4
        with:
          name: ltr-dqn-t6-and-c4-${{ github.run_id }}
          path: |
            results/T6/
            results/appendix_figures/
            temp/train_manifest.json
            temp/t6_runs/t6_raw.csv
            temp/t6_runs/t6_manifest.json
          if-no-files-found: error
          retention-days: 14
