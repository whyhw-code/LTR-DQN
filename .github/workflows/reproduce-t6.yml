name: Reproduce T6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    timeout-minutes: 720
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9.13
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "from experiment_core import validate_runtime; validate_runtime()"
      - name: Train three-year models
        run: python train.py --models all --years 3 --ranker_tree_method gpu_hist
      - name: Export T4 baseline reused by T6 100 percent row
        run: python main.py --tables T4 --no_baselines --export_csvs
      - name: Sample T6
        run: python train.py --models all --years 3 --t6 --ranker_tree_method gpu_hist --t6_require_gpu
      - name: Export T6 workbook and Figure C4
        run: |
          python T6_main.py
          python Appendix_Fig_main.py --figures C4 --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltr-dqn-t6-${{ github.run_id }}
          path: |
            results/T6/
            results/appendix_figures/
          if-no-files-found: warn
          retention-days: 14
